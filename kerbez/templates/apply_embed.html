<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Өтінім · {{ s.title }}</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@400;600;800&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header><div class="wrap bar"><a class="brand" href="{{ url_for('index') }}">{{ s.name }}</a><a class="btn small" href="{{ url_for('index') }}">Басты бет</a></div></header>
<main>
<section class="formpage"><div class="wrap narrow">
  <h1 class="h1s">Өтінім қалдыру</h1>
  <p class="lead">Форманы толтырып, төменгі «Отправить» батырмасын басыңыз. Форма ашылмаса, <a href="{{ form_url }}" target="_blank" rel="noopener">жаңа терезеде ашыңыз</a>.</p>
  <div class="embed"><iframe src="{{ embed_url }}" title="Тіркелу формасы" loading="lazy">Жүктелуде…</iframe></div>
</div></section>
</main>
<footer><div class="wrap center">{{ s.footer }}</div></footer>
</body>
</html>
